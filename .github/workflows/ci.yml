name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:smoke

      # The suite analyses the synthetic repository test/fixture-repo.js builds from its own
      # literals, so the run needs no clone of another project and no network. With CI set,
      # a stage that finds nothing to check fails instead of skipping.
      # `npm test` is the parallel runner (test/run.js, full tier); it exits 1 on any failure or hang.
      - run: npm test
