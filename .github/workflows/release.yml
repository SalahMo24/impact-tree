name: Release

# Pushing a tag such as v1.0.0 builds the .vsix once and publishes that same file to the
# VS Code Marketplace and Open VSX, then attaches it to a GitHub release. A store that already
# holds the version (published by hand, or an earlier run that failed later) is left alone, so
# the run can be repeated by moving the tag: git tag -f v1.0.0 && git push -f origin v1.0.0
# Repository secrets it needs:
#   VSCE_PAT                 Azure DevOps token with Marketplace > Manage
#   OVSX_PAT                 Open VSX access token for the SalahMo24 namespace
#   IMPACT_TREE_POSTHOG_KEY  PostHog project key (phc_...), written into the package only

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test:smoke

      - name: Package
        env:
          IMPACT_TREE_POSTHOG_KEY: ${{ secrets.IMPACT_TREE_POSTHOG_KEY }}
        run: npm run package -- -o impact-tree.vsix

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if ! npx -y @vscode/vsce@4.1.0 publish --packagePath impact-tree.vsix 2>&1 | tee vsce.log; then
            grep -q "already exists" vsce.log || exit 1
            echo "This version is already on the Marketplace; nothing to publish."
          fi

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if ! npx -y ovsx@1.3.0 publish impact-tree.vsix 2>&1 | tee ovsx.log; then
            grep -q "already published" ovsx.log || exit 1
            echo "This version is already on Open VSX; nothing to publish."
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" impact-tree.vsix --clobber
          else
            gh release create "${GITHUB_REF_NAME}" impact-tree.vsix --title "${GITHUB_REF_NAME}" --notes "See CHANGELOG.md."
          fi
